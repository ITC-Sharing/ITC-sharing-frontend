server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version in error pages and the Server header.
  server_tokens off;

  # Security headers, including the CSP, generated at container start by
  # /docker-entrypoint.d/30-csp.sh — the policy names the API and storage
  # origins, which are deployment facts rather than build-time ones.
  #
  # Included in EVERY block below that sets an add_header of its own. nginx
  # inherits add_header from the enclosing level "if and only if there are no
  # add_header directives defined on the current level" — so one Cache-Control
  # in a location silently drops every security header the server block set.
  # index.html is precisely such a location, and it is the response the CSP
  # exists to protect.
  include /etc/nginx/snippets/security-headers.conf;

  # Long-cache fingerprinted assets emitted by Vite (hashed filenames).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Never cache the app shell — otherwise clients keep an old index.html
  # that references assets deleted by the next deploy.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Lightweight health check for load balancers / orchestrators.
  #
  # default_type rather than an add_header: `return 200 "..."` already emits a
  # Content-Type of its own, so adding a second one sent both. Setting the type
  # instead leaves this block with no add_header at all, which is why it needs
  # no include — the server-level headers are inherited.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA: hand every other route to index.html for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/woff2;
}
