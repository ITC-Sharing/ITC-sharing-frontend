# Checks every change to the frontend before it can be merged.
#
# Not a copy of the backend workflow: this project type-checks with vue-tsc,
# builds with Vite, and runs two linters rather than one.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 20 to match Dockerfile's build stage. Passing on a version the image
      # never runs would be a check that proves the wrong thing.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the build: vue-tsc reports the error against the source line,
      # where Vite would only report that the build failed.
      - name: Type-check
        run: npm run type-check

      # `lint:ci`, not `lint`. The `lint` script passes --fix to both linters,
      # which in a throwaway container rewrites the files and then reports
      # success — a gate that can never fail.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build-only
